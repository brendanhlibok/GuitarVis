<html>
    <head>
        <title>GuitarVis</title>
        <link rel="stylesheet" href="styles.css">
    </head>
    <body>
        <h1>GuitarVis</h1>
            <nav>
                <ul class="main-menu">
                    <label for="key">Key</label>
                    <select name="key" id="key" title="key">
                        <option>C</option>
                        <option>C#</option>
                        <option>D</option>
                        <option>Eb</option>
                        <option>E</option>
                        <option>F</option>
                        <option>Gb</option>
                        <option>G</option>
                        <option>Ab</option>
                        <option>A</option>
                        <option>Bb</option>
                        <option>B</option>
                    </select>
                    <label for ="scale">Scale</label>
                    <select name = "scale" id = "scale" title = "Scale">
                        <option>Major</option>
                        <option>Minor</option>
                    </select>
                    <label for="chords">Chord</label>
                    <select name="chords" id="chords" title="Chord">
                        <option>M</option>
                        <option>m</option>
                        <option>M7</option>
                        <option>m7</option>
                    </select>
                    
                </ul>
            </nav>

            <canvas id="fretboard" width="1000" height="400"></canvas>

            <script src="script.js"></script>
    </body>


</html>
