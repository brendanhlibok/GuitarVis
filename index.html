<html>
    <head>
        <title>GuitarVis</title>
        <link rel="stylesheet" href="styles.css">
    </head>
    <body>
        <h1>GuitarVis</h1>
            <nav>
                <ul class="main-menu">
                    <label for="key">Key</label>
                    <select name="key" id="key" title="key">
                        <option>C</option>
                        <option>C#</option>
                    </select>

                    <label for="chords">Chords</label>
                    <select name="chords" id="chords" title="Chord">
                        <option>M</option>
                        <option>m</option>
                        <option>M7</option>
                        <option>m7</option>
                    </select>
                    
                </ul>
            </nav>

            <canvas id="fretboard" width="700" height="200"></canvas>

            <script src="script.js"></script>
    </body>


</html>
